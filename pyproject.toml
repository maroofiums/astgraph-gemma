[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astgraph"
version = "0.1.0"
description = "Budgeted AST repository maps for small local models (Gemma 4 agents)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["tree-sitter>=0.22", "tree-sitter-python", "networkx"]

[project.optional-dependencies]
hf = ["transformers", "accelerate", "bitsandbytes", "torch"]
mcp = ["mcp"]
bench = ["datasets", "pandas", "matplotlib", "numpy", "transformers"]
dev = ["pytest"]

[project.scripts]
astgraph = "astgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
